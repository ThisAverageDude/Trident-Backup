########################################
# Override the default preheats
########################################

[main]

[preheat PLA]
bed = 65
extruder = 140

[preheat ABS]
bed = 110
extruder = 153

[preheat PA-CF]
bed = 100
extruder = 185

[preheat PC-CF]
bed = 110
extruder = 200

[preheat FLEX]
bed = 0
extruder = 140

[preheat PETG]
bed = 80
extruder = 153



